theme: minima

# 站点基础信息（导航栏、浏览器标签、RSS、SEO读取这里）
title: "梤观 Fenguan"
author: "梤观 Fenguan"
description: >
  Independent Researcher | Interdisciplinary Studies, Sociology, Comparative Civilizations, Chinese Philosophy, Zhuangzi & Xunzi.
  This site hosts a systematic body of works, preprints released continuously on Zenodo.

# 语言
locale: en_US

# 导航菜单（后续你新增posts札记页、归档页，在这里添加）
header_pages:
  - index.md
  - posts.md
  - archive.md

# Minima主题配置
minima:
  skin: auto
  # 关闭默认的站点标题在页面正文渲染（Minima新版支持这个参数）
  page_title: false

# config末尾
stylesheets:
  - assets/css/custom.scss
